spring:
  application:
    name: commerce

  datasource:
    url: jdbc:mysql://localhost:3306/commerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: commerce
    password: commerce
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: DEBUG

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true

jwt:
  token:
    secret-key: ${JWT_SECRET_KEY:dev-local-secret-please-change-min-32bytes}
    exp-minute-time: 30
    refresh-exp-minute-time: 20160
    issuer: commerce

order:
  payment-timeout: PT10M
  expiry-scheduler:
    enabled: true
