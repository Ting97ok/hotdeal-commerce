# 동시성 벤치마크 측정 스택 — Prometheus(수집) + Grafana(시각화)
# 앱은 호스트에서 기동(-Dstock.deduct.strategy=optimistic|conditional|redis),
# 이 스택이 호스트의 /actuator/prometheus 를 스크랩한다.
# 실행: docker compose -f k6/docker-compose.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
