# 다중 인스턴스 동시성 벤치마크 스택 — 단일 스택(docker-compose.yml)과 격리.
# run-multi.sh 가 오케스트레이션: 인프라 up -> nginx upstream 생성 -> app1..N 재기동 + k6 -> down -v.
# app1..3 은 부하가 아니라 관측(actuator)용으로만 호스트 포트(18081~18083)를 연다. 부하는 nginx(18080)만 경유.
name: commerce-bench-multi

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: commerce-bench-app:latest
  environment:
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/commerce?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    SPRING_DATASOURCE_USERNAME: commerce
    SPRING_DATASOURCE_PASSWORD: commerce
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    STOCK_DEDUCT_STRATEGY: "${STRATEGY:-conditional}"
    ORDER_EXPIRY_SCHEDULER_ENABLED: "false"
    PAYMENT_RESOLUTION_SCHEDULER_ENABLED: "false"
    LOGGING_LEVEL_ORG_HIBERNATE_SQL: "WARN"
    # 계정 토큰을 회차마다 다시 발급하지 않으려고 만료를 늘렸다. 기본 30분이면
    # 스윕 전량(수십 회차)이 도는 동안 만료돼 측정이 401 로 무너진다.
    # 토큰 검증 비용은 만료값과 무관하므로 측정에 영향이 없다.
    JWT_TOKEN_EXP_MINUTE_TIME: "600"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: commerce
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
    ports:
      - "13306:3306"
    # 스토리지 전환 — 데이터 디렉터리를 tmpfs 로 둘지 디스크(named volume)로 둘지.
    # compose 는 tmpfs 항목을 override 파일로 지울 수 없어(리스트가 병합된다) 마운트
    # '대상 경로'를 변수로 돌린다. 안 쓰는 쪽은 더미 경로로 가서 아무 영향이 없다.
    #   tmpfs(기본) : MYSQL_TMPFS_TARGET=/var/lib/mysql
    #   디스크      : MYSQL_DISK_TARGET=/var/lib/mysql  + MYSQL_TMPFS_TARGET=더미
    tmpfs:
      - ${MYSQL_TMPFS_TARGET:-/var/lib/mysql}
    volumes:
      - mysql-data:${MYSQL_DISK_TARGET:-/var/lib/mysql-unused}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "16379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  app1:
    <<: *app
    ports:
      - "18081:8080"
  app2:
    <<: *app
    ports:
      - "18082:8080"
  app3:
    <<: *app
    ports:
      - "18083:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1

volumes:
  mysql-data:
