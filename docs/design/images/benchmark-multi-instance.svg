<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="820" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0f172a">앱을 늘리면 왜 느려지나 — 원인을 둘로 분리</text>
  <text x="40" y="66" font-size="14" fill="#64748b">선 = 주문 API 지연 p95 · 부하는 동시 1,000명 · 1,000건으로 동일, 앱 대수만 1 → 3</text>

  <line x1="130" y1="380" x2="700" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <text x="120" y="385" font-size="12" fill="#94a3b8" text-anchor="end">0s</text>
  <line x1="130" y1="303" x2="700" y2="303" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="308" font-size="12" fill="#94a3b8" text-anchor="end">1s</text>
  <line x1="130" y1="226" x2="700" y2="226" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="231" font-size="12" fill="#94a3b8" text-anchor="end">2s</text>
  <line x1="130" y1="149" x2="700" y2="149" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="154" font-size="12" fill="#94a3b8" text-anchor="end">3s</text>

  <text x="250" y="402" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">1 인스턴스</text>
  <text x="580" y="402" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">3 인스턴스</text>

  <!-- conditional: 1.44s(269) → 2.52s(186) -->
  <line x1="250" y1="269" x2="580" y2="186" stroke="#dc2626" stroke-width="3"/>
  <circle cx="250" cy="269" r="6" fill="#dc2626"/>
  <circle cx="580" cy="186" r="6" fill="#dc2626"/>
  <text x="234" y="264" font-size="14" font-weight="700" fill="#dc2626" text-anchor="end">1.44s</text>
  <text x="596" y="181" font-size="16" font-weight="700" fill="#dc2626">2.52s</text>

  <!-- redis: 1.10s(295) → 1.99s(227) -->
  <line x1="250" y1="295" x2="580" y2="227" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="250" cy="295" r="6" fill="#1d4ed8"/>
  <circle cx="580" cy="227" r="6" fill="#1d4ed8"/>
  <text x="234" y="310" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="end">1.10s</text>
  <text x="596" y="240" font-size="16" font-weight="700" fill="#1d4ed8">1.99s</text>

  <!-- 두 선의 간격 = 락 경합 몫 -->
  <line x1="568" y1="186" x2="568" y2="227" stroke="#0f172a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="596" y="207" font-size="12.5" font-weight="700" fill="#0f172a">0.53s = 락 경합 몫</text>

  <!-- 락 대기 누적 배지 -->
  <rect x="130" y="424" width="330" height="30" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="146" y="443" font-size="12.5" fill="#991b1b">조건부 행 락 대기 누적 <tspan font-weight="700">5.2s → 45.8s (8.8배)</tspan></text>
  <rect x="474" y="424" width="306" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="490" y="443" font-size="12.5" fill="#1e3a8a">Redis 락 대기 <tspan font-weight="700">0 — 그런데도 1.8배 악화</tspan></text>

  <rect x="230" y="88" width="16" height="4" fill="#dc2626"/>
  <text x="254" y="93" font-size="13" fill="#334155">조건부 UPDATE (DB 단일 행)</text>
  <rect x="470" y="88" width="16" height="4" fill="#1d4ed8"/>
  <text x="494" y="93" font-size="13" fill="#334155">Redis + Lua (재고 행 미접근)</text>

  <text x="40" y="115" font-size="12.5" fill="#475569">락을 전혀 쓰지 않는 Redis도 1.8배 느려졌다 → 락 경합 외에 자원 경합이 함께 작용. 두 선의 간격이 락 경합만의 몫이다.</text>
</svg>
