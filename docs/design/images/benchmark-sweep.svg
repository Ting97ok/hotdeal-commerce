<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="860" height="500" fill="#ffffff"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#0f172a">인원을 늘리면 어디서 목표선을 넘나</text>
  <text x="40" y="63" font-size="13.5" fill="#64748b">선 = 주문 API 지연 p95 의 중앙값(6회) · 재고는 인원의 두 배로 두어 전원이 살 수 있는 조건 · 양축 로그</text>

  <!-- 요청 유실 구간 음영 -->
  <rect x="665" y="90" width="75" height="290" fill="#fef2f2"/>
  <text x="658" y="100" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="end">인원 2,000↑ 요청 유실 시작 →</text>

  <!-- y 눈금 -->
  <line x1="110" y1="342" x2="740" y2="342" stroke="#f1f5f9" stroke-width="1"/>
  <text x="100" y="346" font-size="11.5" fill="#94a3b8" text-anchor="end">100ms</text>
  <line x1="110" y1="254" x2="740" y2="254" stroke="#f1f5f9" stroke-width="1"/>
  <text x="100" y="258" font-size="11.5" fill="#94a3b8" text-anchor="end">500ms</text>
  <line x1="110" y1="216" x2="740" y2="216" stroke="#f1f5f9" stroke-width="1"/>
  <text x="100" y="220" font-size="11.5" fill="#94a3b8" text-anchor="end">1초</text>
  <line x1="110" y1="128" x2="740" y2="128" stroke="#f1f5f9" stroke-width="1"/>
  <text x="100" y="132" font-size="11.5" fill="#94a3b8" text-anchor="end">5초</text>
  <line x1="110" y1="90" x2="740" y2="90" stroke="#f1f5f9" stroke-width="1"/>
  <text x="100" y="94" font-size="11.5" fill="#94a3b8" text-anchor="end">10초</text>

  <!-- SLA 선 -->
  <line x1="110" y1="178" x2="740" y2="178" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="114" y="172" font-size="12.5" font-weight="700" fill="#0f172a">SLA 2초</text>

  <!-- x 축 -->
  <line x1="110" y1="380" x2="740" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <text x="110" y="400" font-size="12" fill="#64748b" text-anchor="middle">100</text>
  <text x="280" y="400" font-size="12" fill="#64748b" text-anchor="middle">250</text>
  <text x="408" y="400" font-size="12" fill="#64748b" text-anchor="middle">500</text>
  <text x="536" y="400" font-size="12" fill="#64748b" text-anchor="middle">1,000</text>
  <text x="665" y="400" font-size="12" fill="#64748b" text-anchor="middle">2,000</text>
  <text x="740" y="400" font-size="12" fill="#64748b" text-anchor="middle">3,000</text>
  <text x="425" y="422" font-size="12.5" fill="#475569" text-anchor="middle">동시 인원</text>

  <!-- 조건부 앱 3 -->
  <polyline points="110,330 280,294 408,249 536,198 665,147 740,109" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="110" cy="330" r="4.5" fill="#dc2626"/><circle cx="280" cy="294" r="4.5" fill="#dc2626"/>
  <circle cx="408" cy="249" r="4.5" fill="#dc2626"/><circle cx="536" cy="198" r="4.5" fill="#dc2626"/>
  <circle cx="665" cy="147" r="4.5" fill="#dc2626"/><circle cx="740" cy="109" r="4.5" fill="#dc2626"/>
  <text x="736" y="100" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end">7.03초</text>

  <!-- 조건부 앱 1 -->
  <polyline points="110,362 280,324 408,316 536,263 665,216 740,175" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="536" cy="263" r="4" fill="#f87171"/><circle cx="740" cy="175" r="4" fill="#f87171"/>

  <!-- Redis 앱 3 -->
  <polyline points="110,328 280,294 408,255 536,228 665,184 740,164" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="110" cy="328" r="4.5" fill="#1d4ed8"/><circle cx="280" cy="294" r="4.5" fill="#1d4ed8"/>
  <circle cx="408" cy="255" r="4.5" fill="#1d4ed8"/><circle cx="536" cy="228" r="4.5" fill="#1d4ed8"/>
  <circle cx="665" cy="184" r="4.5" fill="#1d4ed8"/><circle cx="740" cy="164" r="4.5" fill="#1d4ed8"/>
  <text x="734" y="152" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="end">2.60초</text>

  <!-- Redis 앱 1 -->
  <polyline points="110,345 280,323 408,284 536,255 665,213 740,176" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="536" cy="255" r="4" fill="#93c5fd"/><circle cx="740" cy="176" r="4" fill="#93c5fd"/>

  <!-- 범례 -->
  <rect x="180" y="440" width="18" height="3" fill="#dc2626"/>
  <text x="206" y="446" font-size="12.5" fill="#334155">조건부 · 앱 3</text>
  <rect x="300" y="440" width="18" height="3" fill="#f87171"/>
  <text x="326" y="446" font-size="12.5" fill="#334155">조건부 · 앱 1</text>
  <rect x="420" y="440" width="18" height="3" fill="#1d4ed8"/>
  <text x="446" y="446" font-size="12.5" fill="#334155">Redis · 앱 3</text>
  <rect x="536" y="440" width="18" height="3" fill="#93c5fd"/>
  <text x="562" y="446" font-size="12.5" fill="#334155">Redis · 앱 1</text>

  <text x="40" y="478" font-size="12.5" fill="#475569">앱을 늘리면 전 구간에서 느려진다. 인원 2,000 부터는 연결이 성립하지 않는 요청이 나오므로 그 오른쪽 값은 완주한 요청만의 것이라 낙관적이다.</text>
</svg>
