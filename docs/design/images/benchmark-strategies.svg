  <text x="40" y="452" font-size="12.5" fill="#475569">낙관락은 버전 충돌로 성공 163 — 정확하나 비실용(탈락). 조건부·Redis 는 1,000 동률, 조건부가 p95 최저·쿼리 1문으로 가장 단순해 운영 채택.</text>
