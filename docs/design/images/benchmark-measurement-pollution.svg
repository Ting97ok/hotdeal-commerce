  <text x="605" y="200" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">1.48s</text>

  <path d="M 268 118 C 360 150, 420 200, 505 219" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="388" y="168" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">조건부 −0.88s</text>
  <text x="388" y="185" font-size="11.5" fill="#dc2626" text-anchor="middle">오염 제거</text>

  <text x="285" y="404" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">호스트 측정</text>
  <text x="285" y="423" font-size="11.5" fill="#94a3b8" text-anchor="middle">SQL 로그 on · 공유 DB</text>
  <text x="565" y="404" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">격리 측정</text>
  <text x="565" y="423" font-size="11.5" fill="#94a3b8" text-anchor="middle">로그 off · tmpfs DB</text>

  <rect x="602" y="100" width="14" height="14" rx="2" fill="#1d4ed8"/>
  <text x="622" y="112" font-size="12.5" fill="#334155">조건부 UPDATE</text>
  <rect x="602" y="122" width="14" height="14" rx="2" fill="#94a3b8"/>
  <text x="622" y="134" font-size="12.5" fill="#334155">Redis+Lua</text>

  <text x="40" y="450" font-size="12.5" fill="#475569">호스트에선 Redis(1.44s)가 조건부(2.25s)보다 빨라 보였으나 — 원인은 조건부만 겪는 SQL DEBUG 로깅 오염.</text>
  <text x="40" y="466" font-size="12.5" fill="#475569">격리 스택에서 조건부가 1.37s 로 급락해 "Redis 우위"가 사라졌다. 측정 오염을 걷어내니 결론이 바뀐 사례.</text>
