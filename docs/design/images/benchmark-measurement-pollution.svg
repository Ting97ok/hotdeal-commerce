    </marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0f172a">측정 환경이 결론을 바꿨다 — 재고 경합 p95</text>
  <text x="40" y="66" font-size="14" fill="#64748b">같은 워크로드(동시 1,000 · 재고 10 품절 경합) · 낮을수록 빠름</text>

  <line x1="90" y1="380" x2="760" y2="380" stroke="#cbd5e1" stroke-width="1"/>
  <text x="80" y="385" font-size="12" fill="#94a3b8" text-anchor="end">0s</text>
  <line x1="90" y1="322" x2="760" y2="322" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="327" font-size="12" fill="#94a3b8" text-anchor="end">0.5s</text>
  <line x1="90" y1="264" x2="760" y2="264" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="269" font-size="12" fill="#94a3b8" text-anchor="end">1.0s</text>
  <line x1="90" y1="206" x2="760" y2="206" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="211" font-size="12" fill="#94a3b8" text-anchor="end">1.5s</text>
  <line x1="90" y1="148" x2="760" y2="148" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="153" font-size="12" fill="#94a3b8" text-anchor="end">2.0s</text>
  <line x1="90" y1="90" x2="760" y2="90" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="95" font-size="12" fill="#94a3b8" text-anchor="end">2.5s</text>

  <line x1="425" y1="90" x2="425" y2="380" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="210" y="119" width="70" height="261" fill="#1d4ed8"/>
  <text x="245" y="111" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">2.25s</text>
  <rect x="290" y="213" width="70" height="167" fill="#94a3b8"/>
  <text x="325" y="205" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">1.44s</text>

  <rect x="490" y="221" width="70" height="159" fill="#1d4ed8"/>
  <text x="525" y="213" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">1.37s</text>
